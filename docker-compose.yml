version: "3.8"

services:
  driftforge:
    build: .
    container_name: driftforge-app
    ports:
      - "8080:8080"
    volumes:
      - driftforge-data:/app/data
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  driftforge-data:
    driver: local
