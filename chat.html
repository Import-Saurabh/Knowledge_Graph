<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Graph Chat — DriftForge</title>
  <meta name="description" content="Dedicated conversational workspace for DriftForge's evidence-backed news knowledge graph.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <!-- Markdown parser -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #0f1117;
      --sidebar-bg: #141722;
      --surface: rgba(20, 22, 30, 0.95);
      --surface-hover: rgba(35, 39, 52, 0.95);
      --border: #2a2d3a;
      --border-focus: #3b82f6;
      --text: #e0e0e0;
      --text-dim: rgba(224, 224, 224, 0.55);
      --accent: #f97316;
      --accent-blue: #3b82f6;
      --radius: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* ── Sidebar ── */
    #sidebar {
      width: 280px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: transform 0.25s ease;
    }

    .sidebar-header {
      padding: 18px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: #fff;
    }
    .brand-tag {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      background: rgba(249, 115, 22, 0.15);
      color: var(--accent);
      padding: 2px 6px;
      border-radius: 4px;
    }

    /* Workspace Nav Items */
    .nav-section {
      padding: 12px 10px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: var(--radius);
      color: var(--text-dim);
      text-decoration: none;
      font-size: 13.5px;
      font-weight: 500;
      transition: all 0.15s ease;
    }
    .nav-item:hover {
      background: var(--surface-hover);
      color: var(--text);
    }
    .nav-item.active {
      background: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
      border: 1px solid rgba(59, 130, 246, 0.3);
    }

    /* Conversation History List */
    .conv-header {
      padding: 14px 16px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .conv-header span {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-dim);
      font-weight: 600;
    }
    .new-chat-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    .new-chat-btn:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    .conv-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .conv-item {
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      color: var(--text-dim);
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: all 0.15s;
    }
    .conv-item:hover {
      background: var(--surface-hover);
      color: var(--text);
    }
    .conv-item.active {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }

    /* ── Main Chat Area ── */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      position: relative;
    }

    /* Top Bar */
    .chat-topbar {
      height: 60px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      backdrop-filter: blur(8px);
    }
    .chat-topbar-title {
      font-size: 15px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .live-indicator {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
    }

    /* Messages Stream */
    #chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
    }

    /* Message Bubbles */
    .msg-row {
      display: flex;
      flex-direction: column;
      gap: 8px;
      animation: fadeIn 0.2s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg-user {
      align-self: flex-end;
      max-width: 80%;
      background: #1e293b;
      border: 1px solid #334155;
      padding: 12px 16px;
      border-radius: 14px 14px 2px 14px;
      color: #fff;
      font-size: 14.5px;
      line-height: 1.5;
    }

    .msg-assistant {
      align-self: flex-start;
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 18px 20px;
      border-radius: 14px 14px 14px 2px;
      color: var(--text);
      font-size: 14.5px;
      line-height: 1.65;
    }

    .msg-assistant h1, .msg-assistant h2, .msg-assistant h3 {
      color: #fff;
      margin: 14px 0 8px;
      font-weight: 600;
    }
    .msg-assistant h2 { font-size: 17px; }
    .msg-assistant h3 { font-size: 15px; }
    .msg-assistant p { margin-bottom: 10px; }
    .msg-assistant ul, .msg-assistant ol { margin-left: 20px; margin-bottom: 12px; }
    .msg-assistant li { margin-bottom: 4px; }
    .msg-assistant a { color: #60a5fa; text-decoration: none; }
    .msg-assistant a:hover { text-decoration: underline; }

    /* Explore in Graph Action Bar */
    .explore-bar {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }
    .explore-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: linear-gradient(135deg, #f97316, #ea580c);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .explore-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(249, 115, 22, 0.35);
    }

    /* Citations Drawer */
    .citations-section {
      margin-top: 14px;
      background: rgba(15, 17, 23, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 8px;
      padding: 10px 14px;
    }
    .citations-header {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
